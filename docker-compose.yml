services:
  dashboard:
    build: .
    container_name: dashboard
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3060:3000"  # reserved for Dashboard on MLG-VPS02
    volumes:
      - ./db:/app/db
    networks:
      - default
      - apps-net

networks:
  apps-net:
    external: true
